[package]
name = "chaosnexus-codex"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
rust-mcp-sdk = "1.0.1"
rust-mcp-transport = "1.0.0"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
async-trait = "0.1.91"
walkdir = "2.5.0"
tempfile = "3.27.0"
rust-embed = { version = "8.12.0", optional = true }
toml = "1.1.4"
clap = "4.6.5"
rust-mcp-axum = "1.0.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
directories = "6.0.0"
[features]
default = []
embed-docs = ["dep:rust-embed"]
